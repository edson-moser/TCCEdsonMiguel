<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Tarefas</title>
    <link rel="stylesheet" href="paginaInicial.css">
</head>

<body>

<div class="slideforma">
    <div class="slider">

        <div class="slides">
            <!--Radio Buttons-->
            <input type="radio" name="radio-btn" id="radio1">
            <input type="radio" name="radio-btn" id="radio2">
            <input type="radio" name="radio-btn" id="radio3">
            <input type="radio" name="radio-btn" id="radio4">

            <!--Fim Radio Buttons-->

            <!--Slide images-->

            <div class="slide first">
                <img src="https://sujeitoprogramador.com/wp-content/uploads/2021/03/thumb-video.png" alt="Imagen 1" />
            </div>
            <div class="slide">
                <img src="https://sujeitoprogramador.com/wp-content/uploads/2021/09/thumb.png" alt="Imagen 2" />
            </div>
            <div class="slide">
                <img src="https://sujeitoprogramador.com/wp-content/uploads/2021/06/thumpost.png" alt="Imagem 3" />
            </div>

            <div class="slide">
                <img src="https://sujeitoprogramador.com/wp-content/uploads/2018/12/qualpc.png" alt="Imagem 4" />
            </div>

            <!--Fin Slide images-->

            <!--Navigation auto-->

            <div class="navigation-auto">
                <div class="auto-btn1"></div>
                <div class="auto-btn2"></div>
                <div class="auto-btn3"></div>
                <div class="auto-btn4"></div>

            </div>
        </div>

        <div class="manual-navigation">
            <label for="radiol" class="manual-btn"></label>
            <label for="radio2" class="manual-btn"></label>
            <label for="radio" class="manual-btn"></label>
            <label for="radio" class="manual-btn"></label>

        </div>
    </div>

</div>

    <section class="container">
        <h1>Lista de Tarefas</h1>
        <div id="taskInputContainer">
            <input type="text" id="taskInput" placeholder="Digite a tarefa">
            <button onclick="addTask()">+</button>
        </div>
        <ul id="taskList">
        </ul>
        <div class="progress-container">
            <div class="progress-bar" id="progressBar"></div>
        </div>
    </section>
    <script src="paginaInicial.js"></script>

   
</body>

</html>
